name: Verify nsjail config logging Docker build

on:
  push:
    branches:
      - codex/verify-config-docker

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 8b1531a71e6409270bf33f2f6dcdcc9ba3728399
          persist-credentials: false
      - name: Build the reviewed Dockerfile
        run: |
          test "$(git rev-parse HEAD)" = 8b1531a71e6409270bf33f2f6dcdcc9ba3728399
          docker build . --file Dockerfile --tag nsjail-config-log-test
      - name: Verify the Docker image configuration logs
        shell: bash
        run: |
          docker_options=(--rm --network none --read-only --user 65534:65534
            --cap-drop ALL --security-opt no-new-privileges
            --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777)
          docker run "${docker_options[@]}" \
            --mount "type=bind,source=$PWD/tests/config_debug_log.sh,target=/regression.sh,readonly" \
            nsjail-config-log-test sh /regression.sh /bin/nsjail
          echo "The container passed the TextProto and JSON environment value checks."

          fixtures=$(mktemp -d "$RUNNER_TEMP/nsjail-config.XXXXXX")
          chmod 0755 "$fixtures"
          marker=nsjail-inline-fixture-value
          encoded_marker=$(printf "%s" "$marker" | base64 -w 0)
          printf 'mount { dst: "/fixture" src_content: "%s" }\n' "$marker" > "$fixtures/config.cfg"
          printf '{"mount":[{"dst":"/fixture","srcContent":"%s"}]}\n' "$encoded_marker" > "$fixtures/config.json"

          check_inline_log() {
            local config=$1 format=$2 output
            output=$(docker run "${docker_options[@]}" \
              --mount "type=bind,source=$fixtures,target=/fixtures,readonly" \
              nsjail-config-log-test /bin/nsjail --verbose --config "/fixtures/$config" --help 2>&1 >/dev/null)
            grep -F "Parsed $format config from" <<< "$output" >/dev/null
            grep -F "/fixtures/$config" <<< "$output" >/dev/null
            if grep -Fq -e "$marker" -e "$encoded_marker" <<< "$output"; then
              echo "$format inline file contents appeared in the container log" >&2
              return 1
            fi
            echo "The container retained the $format diagnostic and omitted inline file contents."
          }

          check_inline_log config.cfg TextProto
          check_inline_log config.json JSON
